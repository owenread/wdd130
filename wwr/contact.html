<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting</title>

    <meta name="description"
      content="Get in contact with us so you too can go on amazing adventures!">
    <meta name="author" content="Owen Read">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="White Water Rafting Logo Crossed Oars">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-page">

        <!-- Company Info Section -->
        <section class="company-info">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>

            <div class="map-form-wrapper">
                <!-- Google Map -->
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d9379.017325519082!2d-122.00946884983372!3d36.9690042903094!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1770494912092!5m2!1sen!2sus"
                  loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                </iframe>

                <!-- Contact Form -->
                <form class="contact-form" action="#" method="post">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your Name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Your Email" required>

                    <p>Message Purpose:</p>
                    <div class="radio-group">
                        <label><input type="radio" name="purpose" value="general" required> General
                            Inquiry</label>
                        <label><input type="radio" name="purpose" value="reservation"> Reservation
                            Question</label>
                        <label><input type="radio" name="purpose" value="suggestion"> Website
                            Suggestion</label>
                    </div>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5"
                      placeholder="Type your message here"></textarea>

                    <label><input type="checkbox" name="subscribe"> Please subscribe me to the
                        monthly newsletter</label>

                    <button type="submit">Get in Touch!</button>
                </form>
            </div>
        </section>

        <!-- Employees Section -->
        <section class="employees-section">
            <h2>We Are Here to Serve You</h2>
            <div class="employees">
                <figure>
                    <img src="images/employee1.jpg" alt="Employee 1">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Employee 2">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Employee 3">
                    <figcaption>Employee Profile</figcaption>
                </figure>
            </div>
        </section>

    </main>


    <footer>
        <p>© 2026 White Water Rafting | Owen Read</p>

        <nav class="socialmedia">
            <a href="https://tiktok.com">
                <img src="images/tiktok.svg" alt="Follow us on TikTok">
            </a>
            <a href="https://youtube.com">
                <img src="images/youtube.svg" alt="Follow us on YouTube">
            </a>
            <a href="https://instagram.com">
                <img src="images/insta.svg" alt="Follow us on Instagram">
            </a>
        </nav>
    </footer>

</body>

</html>
